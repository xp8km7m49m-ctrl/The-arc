const STORAGE_KEY = 'the-arc-program-state-v1';

/* ---------------------------------- helpers ---------------------------------- */
function flatItems(content) {
  if (!content) return [];
  return content.blocks.flatMap((b) => b.items);
}
function todayKey() {
  return ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][new Date().getDay()];
}

/* ---------------------------------- component ---------------------------------- */
function TrainingApp() {
  const [loaded, setLoaded] = useState(false);
  const [locations, setLocations] = useState({ tue: null, wed: null, thu: null });
  const [completions, setCompletions] = useState({});
  const [expanded, setExpanded] = useState(() => {
    const t = todayKey();
    const init = {};
    CARD_ORDER.forEach((card) => { init[card.id] = card.day === t; });
    return init;
  });
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [pickerOpen, setPickerOpen] = useState({});

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.locations) setLocations((prev) => ({ ...prev, ...parsed.locations }));
        if (parsed.completions) setCompletions(parsed.completions);
      }
    } catch (e) {
      // no saved state yet, or storage unavailable — start fresh
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ locations, completions }));
    } catch (e) {
      // ignore save errors
    }
  }, [locations, completions, loaded]);

  const getContent = (card) => {
    if (card.kind === 'home') return HOME[card.id];
    const loc = locations[card.day];
    if (!loc) return null;
    return TRAINING[card.day].variants[loc];
  };

  const completionKey = (card) => (card.kind === 'training' ? `${card.id}-${locations[card.day]}` : card.id);

  const cardTotals = (card) => {
    const content = getContent(card);
    const items = flatItems(content);
    const arr = completions[completionKey(card)] || [];
    const done = arr.filter(Boolean).length;
    return { total: items.length, done };
  };

  const toggleItem = (card, flatIndex) => {
    const key = completionKey(card);
    const total = flatItems(getContent(card)).length;
    setCompletions((prev) => {
      const arr = prev[key] ? [...prev[key]] : new Array(total).fill(false);
      arr[flatIndex] = !arr[flatIndex];
      return { ...prev, [key]: arr };
    });
  };

  const weekStats = useMemo(() => {
    const perDay = {};
    let grandTotal = 0, grandDone = 0;
    WEEK_ORDER.forEach((d) => {
      const cards = CARD_ORDER.filter((cd) => cd.day === d);
      let total = 0, done = 0;
      cards.forEach((cd) => {
        const t = cardTotals(cd);
        total += t.total; done += t.done;
      });
      perDay[d] = { total, done };
      grandTotal += total; grandDone += done;
    });
    return { perDay, grandTotal, grandDone };
    // eslint-disable-next-line
  }, [completions, locations]);

  const today = todayKey();

  const resetWeek = () => {
    setCompletions({});
    setLocations({ tue: null, wed: null, thu: null });
    setConfirmingReset(false);
  };

  return (
    <div style={{ background: c.bg, minHeight: '100vh', color: c.ink }}>
      <div style={{ maxWidth: 640, margin: '0 auto', padding: '28px 16px 60px' }}>
        <div style={{ marginBottom: 22 }}>
          <div className="font-display" style={{ fontSize: 40, lineHeight: 1, color: c.ink }}>THE ARC</div>
          <div style={{ fontSize: 13, color: c.ink2, marginTop: 4 }}>Shooting &middot; Strength &middot; Movement — Your Week</div>
        </div>

        <WeekArc perDay={weekStats.perDay} today={today} />
        <div style={{ textAlign: 'center', fontSize: 12, color: c.ink3, marginTop: 6, marginBottom: 22 }} className="font-mono">
          {weekStats.grandDone}/{weekStats.grandTotal || '\u2014'} sessions logged this week
        </div>

        <div style={{
          background: c.card, border: `1px solid ${c.line}`, borderLeft: `3px solid ${c.amber}`,
          borderRadius: 10, padding: '14px 16px', marginBottom: 22, fontSize: 13.5, color: c.ink2, lineHeight: 1.5,
        }}>
          Your baseline is solid but it's been inconsistent lately, so the first 2&ndash;3 weeks lean toward
          moderate volume and clean mechanics over max effort &mdash; nail the form, then push intensity.
          The 45-minute home slots are there whenever you have them; missing one occasionally won't break
          anything. Hitting the three big sessions each week matters far more than being perfect everywhere else.
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {CARD_ORDER.map((card) => (
            <DayCard
              key={card.id}
              card={card}
              content={getContent(card)}
              isToday={card.day === today}
              isOpen={!!expanded[card.id]}
              onToggleOpen={() => setExpanded((p) => ({ ...p, [card.id]: !p[card.id] }))}
              totals={cardTotals(card)}
              completions={completions[completionKey(card)] || []}
              onToggleItem={(idx) => toggleItem(card, idx)}
              location={card.kind === 'training' ? locations[card.day] : undefined}
              onPickLocation={(loc) => {
                setLocations((p) => ({ ...p, [card.day]: loc }));
                setPickerOpen((p) => ({ ...p, [card.id]: false }));
              }}
              pickerOpen={!!pickerOpen[card.id]}
              onOpenPicker={() => setPickerOpen((p) => ({ ...p, [card.id]: true }))}
            />
          ))}
        </div>

        <div style={{ marginTop: 30, textAlign: 'center' }}>
          {!confirmingReset ? (
            <button
              onClick={() => setConfirmingReset(true)}
              style={{ background: 'none', border: 'none', color: c.ink3, fontSize: 12.5, display: 'inline-flex', alignItems: 'center', gap: 6, cursor: 'pointer', padding: 8 }}
            >
              <RotateCcw size={13} /> Start a new week
            </button>
          ) : (
            <div style={{ fontSize: 13, color: c.ink2 }}>
              Clear this week's checkmarks and location picks?
              <div style={{ marginTop: 8, display: 'flex', gap: 8, justifyContent: 'center' }}>
                <button onClick={resetWeek} style={{ background: c.clay, color: c.ink, border: 'none', borderRadius: 8, padding: '7px 14px', fontSize: 12.5, cursor: 'pointer', fontWeight: 600 }}>Yes, reset</button>
                <button onClick={() => setConfirmingReset(false)} style={{ background: 'none', color: c.ink2, border: `1px solid ${c.line}`, borderRadius: 8, padding: '7px 14px', fontSize: 12.5, cursor: 'pointer' }}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function WeekArc({ perDay, today }) {
  const points = { mon: [20, 110], tue: [80, 82], wed: [140, 66], thu: [200, 60], fri: [260, 66], sat: [320, 82], sun: [380, 110] };
  return (
    <svg viewBox="0 0 400 130" style={{ width: '100%', height: 'auto', display: 'block' }}>
      <path d="M20,110 Q200,10 380,110" fill="none" stroke={c.line} strokeWidth="2" />
      {WEEK_ORDER.map((d) => {
        const [x, y] = points[d];
        const { total, done } = perDay[d];
        const state = total === 0 || done === 0 ? 'empty' : done >= total ? 'full' : 'partial';
        const isToday = d === today;
        return (
          <g key={d}>
            {isToday && <circle cx={x} cy={y} r={13} fill="none" stroke={c.amber} strokeWidth="1.5" opacity={0.6} />}
            <circle cx={x} cy={y} r={8.5}
              fill={state === 'full' ? c.green : state === 'partial' ? c.amberSoft : c.bg}
              stroke={state === 'partial' ? c.amber : state === 'full' ? c.green : c.ink3}
              strokeWidth="1.6" />
            {state === 'full' && (
              <path d={`M${x - 3.5},${y} l2.3,2.6 l4.7,-5.2`} stroke={c.bg} strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
            )}
            <text x={x} y={y + 24} textAnchor="middle" fontSize="10.5" fill={isToday ? c.amber : c.ink3} fontFamily="'JetBrains Mono', monospace">{DAY_SHORT[d]}</text>
          </g>
        );
      })}
    </svg>
  );
}

function DayCard({ card, content, isToday, isOpen, onToggleOpen, totals, completions, onToggleItem, location, onPickLocation, pickerOpen, onOpenPicker }) {
  const needsPicker = card.kind === 'training' && !location;
  const meta = card.kind === 'training' ? TRAINING[card.day] : null;
  const title = card.kind === 'training' ? meta.theme : content?.theme;
  const timeLabel = card.kind === 'training' ? meta.time : content?.time;

  return (
    <div style={{ background: c.card, border: `1px solid ${isToday ? c.amber + '55' : c.line}`, borderRadius: 12, overflow: 'hidden' }}>
      <button onClick={onToggleOpen} style={{ width: '100%', background: 'none', border: 'none', cursor: 'pointer', color: c.ink, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left' }}>
        <div className="font-display" style={{ fontSize: 15, background: isToday ? c.amberSoft : 'transparent', color: isToday ? c.amber : c.ink3, padding: '2px 8px', borderRadius: 6, minWidth: 46, textAlign: 'center', letterSpacing: '0.05em' }}>
          {DAY_SHORT[card.day]}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14.5, fontWeight: 600, color: c.ink }}>{title}</div>
          <div style={{ fontSize: 12, color: c.ink3, marginTop: 2 }}>{timeLabel}</div>
        </div>
        {!needsPicker && totals.total > 0 && (
          <div className="font-mono" style={{ fontSize: 12, color: totals.done >= totals.total ? c.green : c.ink3, whiteSpace: 'nowrap' }}>
            {totals.done}/{totals.total}
          </div>
        )}
        {isOpen ? <ChevronUp size={17} color={c.ink3} /> : <ChevronDown size={17} color={c.ink3} />}
      </button>

      {isOpen && (
        <div style={{ padding: '4px 16px 18px' }}>
          {needsPicker ? (
            <LocationPicker onPick={onPickLocation} />
          ) : (
            <>
              {card.kind === 'training' && (
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                  <LocationBadge locKey={location} />
                  <button onClick={onOpenPicker} style={{ background: 'none', border: 'none', color: c.ink3, fontSize: 11.5, cursor: 'pointer', textDecoration: 'underline' }}>change</button>
                </div>
              )}
              {pickerOpen && (<div style={{ marginBottom: 14 }}><LocationPicker onPick={onPickLocation} compact /></div>)}
              {content?.note && (
                <div style={{ display: 'flex', gap: 8, background: c.claySoft, border: `1px solid ${c.clay}44`, borderRadius: 8, padding: '10px 12px', fontSize: 12.5, color: c.ink2, marginBottom: 14, lineHeight: 1.45 }}>
                  <Info size={14} color={c.clay} style={{ flexShrink: 0, marginTop: 1 }} />
                  <span>{content.note}</span>
                </div>
              )}
              {content?.warmup?.length > 0 && (<PlainList label="Warm-up" items={content.warmup} />)}
              {(() => {
                let flatIdx = -1;
                return content?.blocks.map((block, bi) => {
                  const Icon = ICONS[block.icon] || Target;
                  return (
                    <div key={bi} style={{ marginTop: 14 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                        <Icon size={13} color={c.amber} />
                        <span style={{ fontSize: 11.5, textTransform: 'uppercase', letterSpacing: '0.06em', color: c.ink2, fontWeight: 600 }}>{block.label}</span>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                        {block.items.map((item, ii) => {
                          flatIdx += 1;
                          const idx = flatIdx;
                          const checked = !!completions[idx];
                          return (
                            <div key={ii} onClick={() => onToggleItem(idx)} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, cursor: 'pointer', padding: '7px 8px', borderRadius: 8, background: checked ? c.greenSoft : 'transparent' }}>
                              <div style={{ width: 18, height: 18, borderRadius: 5, border: `1.6px solid ${checked ? c.green : c.ink3}`, background: checked ? c.green : 'transparent', flexShrink: 0, marginTop: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                {checked && <Check size={12} color={c.bg} strokeWidth={3} />}
                              </div>
                              <div style={{ flex: 1 }}>
                                <div style={{ fontSize: 13.5, color: checked ? c.ink2 : c.ink, textDecoration: checked ? 'line-through' : 'none' }}>{item.n}</div>
                                <div className="font-mono" style={{ fontSize: 12, color: c.amber, marginTop: 1 }}>{item.d}</div>
                                {item.cue && <div style={{ fontSize: 11.5, color: c.ink3, marginTop: 2, fontStyle: 'italic' }}>{item.cue}</div>}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                });
              })()}
              {content?.cooldown?.length > 0 && (<PlainList label="Cooldown" items={content.cooldown} style={{ marginTop: 14 }} />)}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function PlainList({ label, items, style }) {
  return (
    <div style={style}>
      <div style={{ fontSize: 11.5, textTransform: 'uppercase', letterSpacing: '0.06em', color: c.ink3, fontWeight: 600, marginBottom: 6 }}>{label}</div>
      <div style={{ fontSize: 12.5, color: c.ink2, lineHeight: 1.7 }}>{items.join(' \u00b7 ')}</div>
    </div>
  );
}

function LocationBadge({ locKey }) {
  const opt = LOCATION_OPTS.find((o) => o.key === locKey);
  const Icon = opt?.icon === 'building' ? Building2 : opt?.icon === 'dumbbell' ? Dumbbell : Target;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5, color: c.amber, fontWeight: 600 }}>
      <Icon size={14} /> {opt?.label}
    </div>
  );
}

function LocationPicker({ onPick, compact }) {
  return (
    <div>
      {!compact && (<div style={{ fontSize: 12.5, color: c.ink2, marginBottom: 10 }}>What do you have today?</div>)}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {LOCATION_OPTS.map((opt) => {
          const Icon = opt.icon === 'building' ? Building2 : opt.icon === 'dumbbell' ? Dumbbell : Target;
          return (
            <button key={opt.key} onClick={() => onPick(opt.key)} style={{ display: 'flex', alignItems: 'center', gap: 10, background: c.cardHover, border: `1px solid ${c.line}`, borderRadius: 9, padding: '10px 12px', cursor: 'pointer', textAlign: 'left', color: c.ink }}>
              <div style={{ width: 30, height: 30, borderRadius: 7, background: c.amberSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Icon size={15} color={c.amber} />
              </div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{opt.label}</div>
                <div style={{ fontSize: 11.5, color: c.ink3 }}>{opt.sub}</div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<TrainingApp />);
</script>
</body>
</html>

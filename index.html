var STORAGE_KEY = 'the-arc-program-state-v1';

/* ---------------------------------- state ---------------------------------- */
var state = {
  locations: { tue: null, wed: null, thu: null },
  completions: {},
  expanded: {},
  pickerOpen: {},
  confirmingReset: false
};

function todayKey() {
  return ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][new Date().getDay()];
}

(function initExpanded() {
  var t = todayKey();
  CARD_ORDER.forEach(function (card) { state.expanded[card.id] = card.day === t; });
})();

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed.locations) {
        for (var k in parsed.locations) { state.locations[k] = parsed.locations[k]; }
      }
      if (parsed.completions) state.completions = parsed.completions;
    }
  } catch (e) { /* start fresh */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ locations: state.locations, completions: state.completions }));
  } catch (e) { /* ignore */ }
}

/* ---------------------------------- helpers ---------------------------------- */
function flatItems(content) {
  if (!content) return [];
  var out = [];
  content.blocks.forEach(function (b) { b.items.forEach(function (it) { out.push(it); }); });
  return out;
}

function getContent(card) {
  if (card.kind === 'home') return HOME[card.id];
  var loc = state.locations[card.day];
  if (!loc) return null;
  return TRAINING[card.day].variants[loc];
}

function completionKey(card) {
  return card.kind === 'training' ? (card.id + '-' + state.locations[card.day]) : card.id;
}

function cardTotals(card) {
  var content = getContent(card);
  var items = flatItems(content);
  var arr = state.completions[completionKey(card)] || [];
  var done = arr.filter(Boolean).length;
  return { total: items.length, done: done };
}

function computeWeekStats() {
  var perDay = {};

  WEEK_ORDER.forEach(function (d) {
    var cards = CARD_ORDER.filter(function (cd) { return cd.day === d; });
    var total = 0, done = 0;
    cards.forEach(function (cd) {
      var t = cardTotals(cd);
      total += t.total; done += t.done;
    });
    perDay[d] = { total: total, done: done };
    grandTotal += total; grandDone += done;
  });
  return { perDay: perDay, grandTotal: grandTotal, grandDone: grandDone };
}

/* ---------------------------------- render ---------------------------------- */
function renderPlainList(label, items, extraStyle) {
  if (!items || items.length === 0) return '';
  return '<div style="' + (extraStyle || '') + '">' +
    '<div style="font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:' + c.ink3 + ';font-weight:600;margin-bottom:6px;">' + label + '</div>' +
    '<div style="font-size:12.5px;color:' + c.ink2 + ';line-height:1.7;">' + items.join(' \u00b7 ') + '</div>' +
    '</div>';
}

function locIconFn(iconName) {
  if (iconName === 'building') return iconBuilding2;
  if (iconName === 'dumbbell') return iconDumbbell;
  return iconTarget;
}

function renderLocationBadge(locKey) {
  var opt = null;
  for (var i = 0; i < LOCATION_OPTS.length; i++) { if (LOCATION_OPTS[i].key === locKey) { opt = LOCATION_OPTS[i]; break; } }
  if (!opt) return '';
  var fn = locIconFn(opt.icon);
  return '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:' + c.amber + ';font-weight:600;">' + fn(14, c.amber) + ' ' + opt.label + '</div>';
}

function renderLocationPicker(cardId, compact) {
  var heading = compact ? '' : '<div style="font-size:12.5px;color:' + c.ink2 + ';margin-bottom:10px;">What do you have today?</div>';
  var buttons = LOCATION_OPTS.map(function (opt) {
    var fn = locIconFn(opt.icon);
    return '<button data-action="pick-location" data-card-id="' + cardId + '" data-loc="' + opt.key + '" style="display:flex;align-items:center;gap:10px;background:' + c.cardHover + ';border:1px solid ' + c.line + ';border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;color:' + c.ink + ';width:100%;">' +
      '<div style="width:30px;height:30px;border-radius:7px;background:' + c.amberSoft + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + fn(15, c.amber) + '</div>' +
      '<div><div style="font-size:13.5px;font-weight:600;">' + opt.label + '</div><div style="font-size:11.5px;color:' + c.ink3 + ';">' + opt.sub + '</div></div>' +
      '</button>';
  }).join('');
  return '<div>' + heading + '<div style="display:flex;flex-direction:column;gap:8px;">' + buttons + '</div></div>';
}

function renderDayCard(card) {
  var content = getContent(card);
  var needsPicker = card.kind === 'training' && !state.locations[card.day];
  var meta = card.kind === 'training' ? TRAINING[card.day] : null;
  var title = card.kind === 'training' ? meta.theme : (content ? content.theme : '');
  var timeLabel = card.kind === 'training' ? meta.time : (content ? content.time : '');
  var isToday = card.day === todayKey();
  var isOpen = !!state.expanded[card.id];
  var totals = cardTotals(card);
  var comps = state.completions[completionKey(card)] || [];

  var totalBadge = (!needsPicker && totals.total > 0)
    ? '<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:' + (totals.done >= totals.total ? c.green : c.ink3) + ';white-space:nowrap;">' + totals.done + '/' + totals.total + '</div>'
    : '';

  var chevron = isOpen ? iconChevronUp(17, c.ink3) : iconChevronDown(17, c.ink3);

  var header = '<button data-action="toggle-card" data-card-id="' + card.id + '" style="width:100%;background:none;border:none;cursor:pointer;color:' + c.ink + ';padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;">' +
    '<div style="font-family:\'Bebas Neue\',sans-serif;letter-spacing:0.05em;font-size:15px;background:' + (isToday ? c.amberSoft : 'transparent') + ';color:' + (isToday ? c.amber : c.ink3) + ';padding:2px 8px;border-radius:6px;min-width:46px;text-align:center;">' + DAY_SHORT[card.day] + '</div>' +
    '<div style="flex:1;min-width:0;">' +
      '<div style="font-size:14.5px;font-weight:600;color:' + c.ink + ';">' + title + '</div>' +
      '<div style="font-size:12px;color:' + c.ink3 + ';margin-top:2px;">' + timeLabel + '</div>' +
    '</div>' +
    totalBadge + chevron +
    '</button>';

  var body = '';
  if (isOpen) {
    if (needsPicker) {
      body = '<div style="padding:4px 16px 18px;">' + renderLocationPicker(card.id, false) + '</div>';
    } else {
      var pieces = '';
      if (card.kind === 'training') {
        pieces += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
          renderLocationBadge(state.locations[card.day]) +
          '<button data-action="open-picker" data-card-id="' + card.id + '" style="background:none;border:none;color:' + c.ink3 + ';font-size:11.5px;cursor:pointer;text-decoration:underline;">change</button>' +
          '</div>';
      }
      if (state.pickerOpen[card.id]) {
        pieces += '<div style="margin-bottom:14px;">' + renderLocationPicker(card.id, true) + '</div>';
      }
      if (content && content.note) {
        pieces += '<div style="display:flex;gap:8px;background:' + c.claySoft + ';border:1px solid ' + c.clay + '44;border-radius:8px;padding:10px 12px;font-size:12.5px;color:' + c.ink2 + ';margin-bottom:14px;line-height:1.45;">' +
          '<span style="flex-shrink:0;margin-top:1px;">' + iconInfo(14, c.clay) + '</span><span>' + content.note + '</span>' +
          '</div>';
      }
      if (content && content.warmup && content.warmup.length > 0) {
        pieces += renderPlainList('Warm-up', content.warmup, '');
      }
      if (content) {
        var flatIdx = -1;
        var key = completionKey(card);
        var total = flatItems(content).length;
        content.blocks.forEach(function (block) {
          var fn = ICONS[block.icon] || iconTarget;
          var itemsHtml = block.items.map(function (item) {
            flatIdx += 1;
            var idx = flatIdx;
            var checked = !!comps[idx];
            return '<div data-action="toggle-item" data-key="' + key + '" data-idx="' + idx + '" data-total="' + total + '" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:7px 8px;border-radius:8px;background:' + (checked ? c.greenSoft : 'transparent') + ';">' +
              '<div style="width:18px;height:18px;border-radius:5px;border:1.6px solid ' + (checked ? c.green : c.ink3) + ';background:' + (checked ? c.green : 'transparent') + ';flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;">' +
                (checked ? iconCheck(12, c.bg, 3) : '') +
              '</div>' +
              '<div style="flex:1;">' +
                '<div style="font-size:13.5px;color:' + (checked ? c.ink2 : c.ink) + ';text-decoration:' + (checked ? 'line-through' : 'none') + ';">' + item.n + '</div>' +
                '<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:' + c.amber + ';margin-top:1px;">' + item.d + '</div>' +
                (item.cue ? '<div style="font-size:11.5px;color:' + c.ink3 + ';margin-top:2px;font-style:italic;">' + item.cue + '</div>' : '') +
              '</div>' +
            '</div>';
          }).join('');
          pieces += '<div style="margin-top:14px;">' +
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">' + fn(13, c.amber) + '<span style="font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:' + c.ink2 + ';font-weight:600;">' + block.label + '</span></div>' +
            '<div style="display:flex;flex-direction:column;gap:6px;">' + itemsHtml + '</div>' +
            '</div>';
        });
      }
      if (content && content.cooldown && content.cooldown.length > 0) {
        pieces += renderPlainList('Cooldown', content.cooldown, 'margin-top:14px;');
      }
      body = '<div style="padding:4px 16px 18px;">' + pieces + '</div>';
    }
  }

  return '<div style="background:' + c.card + ';border:1px solid ' + (isToday ? c.amber + '55' : c.line) + ';border-radius:12px;overflow:hidden;">' + header + body + '</div>';
}

function renderWeekArc(perDay, today) {
  var points = { mon: [20, 110], tue: [80, 82], wed: [140, 66], thu: [200, 60], fri: [260, 66], sat: [320, 82], sun: [380, 110] };
  var groups = WEEK_ORDER.map(function (d) {
    var p = points[d]; var x = p[0], y = p[1];
    var t = perDay[d]; var total = t.total, done = t.done;
    var st = (total === 0 || done === 0) ? 'empty' : (done >= total ? 'full' : 'partial');
    var isToday = d === today;
    var ring = isToday ? '<circle cx="' + x + '" cy="' + y + '" r="13" fill="none" stroke="' + c.amber + '" stroke-width="1.5" opacity="0.6"/>' : '';
    var fill = st === 'full' ? c.green : (st === 'partial' ? c.amberSoft : c.bg);
    var stroke = st === 'partial' ? c.amber : (st === 'full' ? c.green : c.ink3);
    var check = st === 'full' ? ('<path d="M' + (x - 3.5) + ',' + y + ' l2.3,2.6 l4.7,-5.2" stroke="' + c.bg + '" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>') : '';
    var label = '<text x="' + x + '" y="' + (y + 24) + '" text-anchor="middle" font-size="10.5" fill="' + (isToday ? c.amber : c.ink3) + '" font-family="\'JetBrains Mono\', monospace">' + DAY_SHORT[d] + '</text>';
    return '<g>' + ring + '<circle cx="' + x + '" cy="' + y + '" r="8.5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.6"/>' + check + label + '</g>';
  }).join('');
  return '<svg viewBox="0 0 400 130" style="width:100%;height:auto;display:block">' +
    '<path d="M20,110 Q200,10 380,110" fill="none" stroke="' + c.line + '" stroke-width="2"/>' + groups +
    '</svg>';
}

function renderApp() {
  var stats = computeWeekStats();
  var today = todayKey();
  var cardsHtml = CARD_ORDER.map(renderDayCard).join('');

  var resetHtml;
  if (state.confirmingReset) {
    resetHtml = '<div style="font-size:13px;color:' + c.ink2 + ';">Clear this week\'s checkmarks and location picks?' +
      '<div style="margin-top:8px;display:flex;gap:8px;justify-content:center;">' +
      '<button data-action="confirm-reset" style="background:' + c.clay + ';color:' + c.ink + ';border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:600;">Yes, reset</button>' +
      '<button data-action="cancel-reset" style="background:none;color:' + c.ink2 + ';border:1px solid ' + c.line + ';border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;">Cancel</button>' +
      '</div></div>';
  } else {
    resetHtml = '<button data-action="start-reset" style="background:none;border:none;color:' + c.ink3 + ';font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:8px;">' + iconRotateCcw(13) + ' Start a new week</button>';
  }

  return '<div style="max-width:640px;margin:0 auto;padding:28px 16px 60px;">' +
    '<div style="margin-bottom:22px;">' +
      '<div style="font-family:\'Bebas Neue\',sans-serif;letter-spacing:0.04em;font-size:40px;line-height:1;color:' + c.ink + ';">THE ARC</div>' +
      '<div style="font-size:13px;color:' + c.ink2 + ';margin-top:4px;">Shooting &middot; Strength &middot; Movement — Your Week</div>' +
    '</div>' +
    renderWeekArc(stats.perDay, today) +
    '<div style="text-align:center;font-size:12px;color:' + c.ink3 + ';margin-top:6px;margin-bottom:22px;font-family:\'JetBrains Mono\',monospace;">' + stats.grandDone + '/' + (stats.grandTotal || '\u2014') + ' sessions logged this week</div>' +
    '<div style="background:' + c.card + ';border:1px solid ' + c.line + ';border-left:3px solid ' + c.amber + ';border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13.5px;color:' + c.ink2 + ';line-height:1.5;">' +
      'Your baseline is solid but it\'s been inconsistent lately, so the first 2&ndash;3 weeks lean toward moderate volume and clean mechanics over max effort &mdash; nail the form, then push intensity. The 45-minute home slots are there whenever you have them; missing one occasionally won\'t break anything. Hitting the three big sessions each week matters far more than being perfect everywhere else.' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;">' + cardsHtml + '</div>' +
    '<div style="margin-top:30px;text-align:center;">' + resetHtml + '</div>' +
    '</div>';
}

function render() {
  document.getElementById('root').innerHTML = renderApp();
}

/* ---------------------------------- events ---------------------------------- */
document.getElementById('root').addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'toggle-card') {
    var id = el.getAttribute('data-card-id');
    state.expanded[id] = !state.expanded[id];
    render();
  } else if (action === 'pick-location') {
    var cardId = el.getAttribute('data-card-id');
    var loc = el.getAttribute('data-loc');
    var card = null;
    for (var i = 0; i < CARD_ORDER.length; i++) { if (CARD_ORDER[i].id === cardId) { card = CARD_ORDER[i]; break; } }
    if (card) {
      state.locations[card.day] = loc;
      state.pickerOpen[cardId] = false;
      saveState();
      render();
    }
  } else if (action === 'open-picker') {
    var cid = el.getAttribute('data-card-id');
    state.pickerOpen[cid] = true;
    render();
  } else if (action === 'toggle-item') {
    var key = el.getAttribute('data-key');
    var idx = parseInt(el.getAttribute('data-idx'), 10);
    var total = parseInt(el.getAttribute('data-total'), 10);
    var arr = state.completions[key] ? state.completions[key].slice() : new Array(total).fill(false);
    arr[idx] = !arr[idx];
    state.completions[key] = arr;
    saveState();
    render();
  } else if (action === 'start-reset') {
    state.confirmingReset = true;
    render();
  } else if (action === 'confirm-reset') {
    state.completions = {};
    state.locations = { tue: null, wed: null, thu: null };
    state.confirmingReset = false;
    saveState();
    render();
  } else if (action === 'cancel-reset') {
    state.confirmingReset = false;
    render();
  }
});

loadState();
render();
</script>
</body>
</html>
